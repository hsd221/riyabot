name: WebUI checks

on:
  pull_request:
    paths:
      - 'webui/**'
      - '.github/workflows/webui.yml'
  push:
    branches:
      - main
      - dev
    paths:
      - 'webui/**'
      - '.github/workflows/webui.yml'

jobs:
  webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Build
        run: bun run build

  build-and-commit:
    # 仅主分支推送时把构建产物提交回仓库，让源码安装用户克隆即得
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Commit webui/dist
        run: |
          if git diff --quiet -- dist/; then
            echo "dist 无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # dist 仍在 .gitignore 中（避免 dev 分支误提交），此处强制加入
          git add -f dist/
          git commit -m "chore: 构建 webui/dist [skip ci]"
          git push
